<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b7a">
<link rel="manifest" href="manifest-contador.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<title>Pedidos de gasto · Contador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f6; --surface:#ffffff; --ink:#16202e; --muted:#5b6778;
  --line:#cdd5e0; --accent:#0f6b7a; --accent-ink:#ffffff;
  --err:#b3261e; --ok:#1f7a4d;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#10161f; --surface:#192230; --ink:#e8edf4; --muted:#9aa7b8;
    --line:#2f3c4f; --accent:#4fb3c4; --accent-ink:#08181c;
    --err:#ff8a80; --ok:#6fd3a0;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  line-height:1.5; min-height:100vh;
  padding:max(20px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
}
main{max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 18px}
h1{font-size:1.6rem;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 10px}
.lead{margin:0 0 20px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px}
label{display:block;font-weight:600;margin:0 0 6px}
.field{margin-bottom:16px}
input{
  width:100%;font:inherit;color:inherit;background:transparent;
  border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;
}
input:focus-visible,button:focus-visible{
  outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px;border-color:var(--accent);
}
button{
  font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:10px;
  padding:11px 14px;background:var(--accent);color:var(--accent-ink);
}
button[disabled]{opacity:.55;cursor:progress}
button.block{width:100%;padding:13px 16px}
button.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
button.danger{background:transparent;color:var(--err);border:1.5px solid var(--err)}
button.small{padding:7px 12px;font-size:.9rem}
.status{margin:12px 0 0;font-size:.95rem;color:var(--muted)}
.status.bad{color:var(--err)}
.top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.titulo{font-weight:700;font-size:1.1rem;overflow-wrap:anywhere}
.monto{font-weight:700;font-size:1.1rem;white-space:nowrap}
.meta{color:var(--muted);font-size:.9rem;margin:2px 0 12px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions .grow{flex:1}
.badge{font-size:.8rem;font-weight:700;border-radius:99px;padding:2px 10px;border:1.5px solid currentColor}
.badge.aprobado{color:var(--ok)} .badge.rechazado{color:var(--err)}
.push{display:flex;align-items:center;justify-content:space-between;gap:12px}
.push .meta{margin:2px 0 0}
.empty{color:var(--muted);padding:6px 2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <section id="login" hidden>
    <h1>Pedidos de gasto</h1>
    <p class="lead">Ingresá para ver y resolver los pedidos pendientes.</p>
    <div class="card">
      <form id="login-form" novalidate>
        <div class="field"><label for="email">Correo</label>
          <input id="email" type="email" autocomplete="username" required></div>
        <div class="field"><label for="password">Contraseña</label>
          <input id="password" type="password" autocomplete="current-password" required></div>
        <button class="block" id="login-btn" type="submit">Ingresar</button>
        <p class="status" id="login-status" role="alert"></p>
      </form>
    </div>
  </section>

  <section id="panel" hidden>
    <header>
      <h1>Pedidos</h1>
      <div class="actions">
        <button class="ghost small" id="refresh" type="button">Actualizar</button>
        <button class="ghost small" id="logout" type="button">Salir</button>
      </div>
    </header>
    <div class="card push" id="push-card" hidden>
      <div><b>Avisos en este celu</b><div class="meta" id="push-msg"></div></div>
      <button class="small" id="push-btn" type="button">Activar avisos</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <h2>Pendientes</h2>
    <div id="pendientes"></div>
    <h2>Resueltos</h2>
    <div id="resueltos"></div>
  </section>
</main>

<script>
const SUPABASE_URL = "https://gegxfanraolistndnwkq.supabase.co";
const SUPABASE_KEY = "sb_publishable_zhsV4zDO-NOdJYmfb4BdPg_1LvxAhG4";
const SESSION_KEY = "pg_contador_session";

const $ = id => document.getElementById(id);
const money = new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS"});
const fecha = iso => new Date(iso).toLocaleString("es-AR",{dateStyle:"medium",timeStyle:"short"});

/* ---------- sesión ---------- */
function loadSession(){ try{ return JSON.parse(localStorage.getItem(SESSION_KEY)); }catch(_){ return null; } }
function saveSession(j){
  const s = { access_token:j.access_token, refresh_token:j.refresh_token,
    expires_at: j.expires_at || Math.floor(Date.now()/1000) + (j.expires_in||3600) };
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }catch(_){}
  return s;
}
function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(_){} }

async function authPost(path, body){
  const r = await fetch(SUPABASE_URL + path, { method:"POST",
    headers:{ apikey:SUPABASE_KEY, "Content-Type":"application/json" }, body:JSON.stringify(body) });
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error_description || j.msg || j.message || ("Error " + r.status));
  return j;
}

async function getToken(){
  let s = loadSession();
  if(!s) return null;
  if(s.expires_at - 60 < Date.now()/1000){
    try{ s = saveSession(await authPost("/auth/v1/token?grant_type=refresh_token",{refresh_token:s.refresh_token})); }
    catch(_){ clearSession(); return null; }
  }
  return s.access_token;
}

async function call(path, opts = {}){
  const t = await getToken();
  if(!t){ showLogin(); throw new Error("Sesión vencida"); }
  const r = await fetch(SUPABASE_URL + path, { ...opts,
    headers:{ apikey:SUPABASE_KEY, Authorization:"Bearer " + t, ...(opts.headers||{}) } });
  if(r.status === 401){ clearSession(); showLogin(); throw new Error("Sesión vencida"); }
  if(!r.ok) throw new Error("Error " + r.status);
  return r;
}

/* ---------- pantallas ---------- */
function showLogin(){ $("panel").hidden = true; $("login").hidden = false; }
function showPanel(){ $("login").hidden = true; $("panel").hidden = false; cargar(); renderPush(); syncPush(); }

$("login-form").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("login-btn"), st = $("login-status");
  st.textContent = ""; st.classList.remove("bad");
  const email = $("email").value.trim(), password = $("password").value;
  if(!email || !password){ st.textContent = "Completá correo y contraseña."; st.classList.add("bad"); return; }
  btn.disabled = true;
  try{
    saveSession(await authPost("/auth/v1/token?grant_type=password",{email,password}));
    $("password").value = "";
    showPanel();
  }catch(err){
    st.textContent = "No se pudo ingresar. Revisá el correo y la contraseña."; st.classList.add("bad");
  }finally{ btn.disabled = false; }
});

$("logout").addEventListener("click", () => { clearSession(); showLogin(); });
$("refresh").addEventListener("click", cargar);

/* ---------- pedidos ---------- */
function setStatus(msg, bad){ const s = $("status"); s.textContent = msg; s.classList.toggle("bad", !!bad); }

function tarjeta(p){
  const card = document.createElement("div"); card.className = "card";
  const top = document.createElement("div"); top.className = "top";
  const t = document.createElement("div"); t.className = "titulo"; t.textContent = p.titulo;
  const m = document.createElement("div"); m.className = "monto"; m.textContent = money.format(p.monto);
  top.append(t, m);
  const meta = document.createElement("div"); meta.className = "meta"; meta.textContent = "Cargado el " + fecha(p.created_at);
  card.append(top, meta);

  const acts = document.createElement("div"); acts.className = "actions";
  if(p.adjunto_path){
    const b = document.createElement("button"); b.className = "ghost small"; b.type = "button"; b.textContent = "Ver adjunto";
    b.addEventListener("click", () => verAdjunto(p.adjunto_path, b));
    acts.append(b);
  }
  if(p.estado === "pendiente"){
    const ok = document.createElement("button"); ok.type = "button"; ok.textContent = "Aprobar";
    const no = document.createElement("button"); no.type = "button"; no.className = "danger"; no.textContent = "Rechazar";
    ok.addEventListener("click", () => decidir(p, "aprobado", [ok,no]));
    no.addEventListener("click", () => decidir(p, "rechazado", [ok,no]));
    acts.append(ok, no);
  }else{
    const bd = document.createElement("span"); bd.className = "badge " + p.estado;
    bd.textContent = p.estado === "aprobado" ? "Aprobado" : "Rechazado";
    acts.append(bd);
  }
  card.append(acts);
  return card;
}

async function cargar(){
  setStatus("Cargando…");
  try{
    const r = await call("/rest/v1/pedidos?select=*&order=created_at.desc&limit=100");
    const lista = await r.json();
    const pen = $("pendientes"), res = $("resueltos");
    pen.replaceChildren(); res.replaceChildren();
    const pendientes = lista.filter(p => p.estado === "pendiente");
    const resueltos = lista.filter(p => p.estado !== "pendiente");
    pendientes.forEach(p => pen.append(tarjeta(p)));
    resueltos.forEach(p => res.append(tarjeta(p)));
    if(!pendientes.length){ const d = document.createElement("div"); d.className = "empty"; d.textContent = "No hay pedidos pendientes."; pen.append(d); }
    if(!resueltos.length){ const d = document.createElement("div"); d.className = "empty"; d.textContent = "Todavía no resolviste ninguno."; res.append(d); }
    setStatus("");
  }catch(err){ if(err.message !== "Sesión vencida") setStatus("No se pudieron cargar los pedidos (" + err.message + ").", true); }
}

async function decidir(p, estado, botones){
  const verbo = estado === "aprobado" ? "aprobar" : "rechazar";
  if(!confirm("¿Querés " + verbo + " «" + p.titulo + "» por " + money.format(p.monto) + "?")) return;
  botones.forEach(b => b.disabled = true);
  try{
    await call("/rest/v1/pedidos?id=eq." + encodeURIComponent(p.id) + "&estado=eq.pendiente", {
      method:"PATCH",
      headers:{ "Content-Type":"application/json", Prefer:"return=minimal" },
      body:JSON.stringify({ estado, decidido_at:new Date().toISOString() })
    });
    await cargar();
  }catch(err){
    botones.forEach(b => b.disabled = false);
    if(err.message !== "Sesión vencida") setStatus("No se pudo guardar la decisión (" + err.message + ").", true);
  }
}

async function verAdjunto(path, btn){
  const w = window.open("", "_blank");
  btn.disabled = true;
  try{
    const r = await call("/storage/v1/object/sign/adjuntos/" + path.split("/").map(encodeURIComponent).join("/"), {
      method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ expiresIn:300 })
    });
    const j = await r.json();
    const url = SUPABASE_URL + "/storage/v1" + j.signedURL;
    if(w) w.location.href = url; else window.location.href = url;
  }catch(err){
    if(w) w.close();
    if(err.message !== "Sesión vencida") setStatus("No se pudo abrir el adjunto (" + err.message + ").", true);
  }finally{ btn.disabled = false; }
}

/* ---------- avisos (notificaciones push) ---------- */
const VAPID_PUBLIC = "BN9r5RQGJFmQoh6Q12Ppq2EpadRJCvTcxoKUs7L6YjKqaBchBFjRoHcDskJ2yrkBqK1ETOiUPAQOVru5PrdNTEc";
const pushOK = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;

function b64uToBytes(s){
  const b = (s + "=".repeat((4 - s.length % 4) % 4)).replace(/-/g,"+").replace(/_/g,"/");
  return Uint8Array.from(atob(b), c => c.charCodeAt(0));
}
async function pushSub(){
  const reg = await navigator.serviceWorker.ready;
  return { reg, sub: await reg.pushManager.getSubscription() };
}
async function guardarSub(sub){
  const j = sub.toJSON();
  const me = await (await call("/auth/v1/user")).json();
  await call("/rest/v1/push_subscriptions?endpoint=eq." + encodeURIComponent(j.endpoint), { method:"DELETE" });
  await call("/rest/v1/push_subscriptions", {
    method:"POST",
    headers:{ "Content-Type":"application/json", Prefer:"return=minimal" },
    body:JSON.stringify({ user_email:me.email, endpoint:j.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth,
      user_agent:navigator.userAgent.slice(0,200) })
  });
}
async function syncPush(){
  if(!pushOK || Notification.permission !== "granted") return;
  try{ const { sub } = await pushSub(); if(sub) await guardarSub(sub); }catch(_){}
}
async function renderPush(){
  const card = $("push-card"), msg = $("push-msg"), btn = $("push-btn");
  card.hidden = false; btn.hidden = false; btn.disabled = false;
  if(!pushOK){
    msg.textContent = "Este navegador no admite avisos. Probá con Chrome en Android o con la app instalada.";
    btn.hidden = true; return;
  }
  if(Notification.permission === "denied"){
    msg.textContent = "Los avisos están bloqueados. Activalos en los ajustes del sitio, en el navegador.";
    btn.hidden = true; return;
  }
  const { sub } = await pushSub();
  if(sub && Notification.permission === "granted"){
    msg.textContent = "Activados: te avisamos cuando entra un pedido nuevo.";
    btn.textContent = "Desactivar"; btn.className = "ghost small"; btn.dataset.mode = "off";
  }else{
    msg.textContent = "Activalos para enterarte al instante de los pedidos nuevos.";
    btn.textContent = "Activar avisos"; btn.className = "small"; btn.dataset.mode = "on";
  }
}
$("push-btn").addEventListener("click", async () => {
  const btn = $("push-btn");
  btn.disabled = true;
  try{
    const { reg, sub } = await pushSub();
    if(btn.dataset.mode === "off"){
      if(sub){
        const ep = sub.endpoint;
        await sub.unsubscribe();
        await call("/rest/v1/push_subscriptions?endpoint=eq." + encodeURIComponent(ep), { method:"DELETE" });
      }
    }else{
      if(await Notification.requestPermission() !== "granted"){ await renderPush(); return; }
      const nueva = sub || await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64uToBytes(VAPID_PUBLIC) });
      await guardarSub(nueva);
    }
  }catch(err){
    if(err.message !== "Sesión vencida"){ $("push-msg").textContent = "No se pudo completar (" + err.message + ")."; }
    btn.disabled = false; return;
  }
  await renderPush();
});
if(pushOK){
  navigator.serviceWorker.addEventListener("message", e => {
    if(e.data && e.data.tipo === "pedido-nuevo" && !$("panel").hidden) cargar();
  });
}

/* ---------- inicio ---------- */
(async () => { (await getToken()) ? showPanel() : showLogin(); })();

if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
</script>
</body>
</html>
