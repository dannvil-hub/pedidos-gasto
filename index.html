<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b7a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pedido de gasto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f6; --surface:#ffffff; --ink:#16202e; --muted:#5b6778;
  --line:#cdd5e0; --accent:#0f6b7a; --accent-ink:#ffffff;
  --err:#b3261e; --ok:#1f7a4d;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#10161f; --surface:#192230; --ink:#e8edf4; --muted:#9aa7b8;
    --line:#2f3c4f; --accent:#4fb3c4; --accent-ink:#08181c;
    --err:#ff8a80; --ok:#6fd3a0;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  line-height:1.5; min-height:100vh;
  padding:max(20px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));
}
main{max-width:460px;margin:0 auto}
h1{font-size:1.75rem;line-height:1.15;margin:12px 0 6px;font-weight:700;letter-spacing:-.01em}
.lead{margin:0 0 22px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
label,.label{display:block;font-weight:600;margin:0 0 6px}
.field{margin-bottom:18px}
.hint{font-weight:400;color:var(--muted)}
input[type=text]{
  width:100%;font:inherit;color:inherit;background:transparent;
  border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;
}
input[type=text]:focus-visible,button:focus-visible,.file:focus-within{
  outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px;border-color:var(--accent);
}
.money{position:relative}
.money span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600}
.money input{padding-left:30px}
.file{
  display:flex;align-items:center;gap:10px;border:1.5px dashed var(--line);
  border-radius:10px;padding:12px;cursor:pointer;
}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.file b{font-weight:600;color:var(--accent)}
.file small{color:var(--muted);display:block}
.err{color:var(--err);font-size:.9rem;margin:6px 0 0;min-height:0}
button{
  font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:10px;
  padding:13px 16px;background:var(--accent);color:var(--accent-ink);width:100%;
}
button[disabled]{opacity:.6;cursor:progress}
button.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.status{margin:12px 0 0;font-size:.95rem;color:var(--muted)}
.status.bad{color:var(--err)}
.done{text-align:left}
.done h2{margin:0 0 6px;font-size:1.3rem;color:var(--ok)}
.done p{margin:0 0 18px;color:var(--muted)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>Pedido de gasto</h1>
  <p class="lead">Cargá el pedido y le llega al contador para que lo apruebe o lo rechace.</p>

  <div class="card">
    <form id="form" novalidate>
      <div class="field">
        <label for="titulo">Título del pedido</label>
        <input id="titulo" type="text" maxlength="120" autocomplete="off" placeholder="Ej.: Compra de micrófonos" required>
        <p class="err" id="e-titulo" role="alert"></p>
      </div>

      <div class="field">
        <label for="monto">Monto</label>
        <div class="money"><span>$</span><input id="monto" type="text" inputmode="decimal" autocomplete="off" placeholder="12.500" required></div>
        <p class="err" id="e-monto" role="alert"></p>
      </div>

      <div class="field">
        <span class="label">Presupuesto adjunto <span class="hint">(opcional)</span></span>
        <label class="file" for="archivo">
          <input id="archivo" type="file" accept="application/pdf,image/jpeg,image/png,image/webp">
          <span><b id="file-name">Elegir PDF o imagen</b><small>Hasta 5 MB</small></span>
        </label>
        <p class="err" id="e-archivo" role="alert"></p>
      </div>

      <button id="enviar" type="submit">Enviar pedido</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>

    <div class="done" id="done" hidden>
      <h2>Pedido enviado</h2>
      <p>El contador ya recibió el aviso.</p>
      <button class="ghost" id="otro" type="button">Cargar otro pedido</button>
    </div>
  </div>
</main>

<script>
const SUPABASE_URL = "https://gegxfanraolistndnwkq.supabase.co";
const SUPABASE_KEY = "sb_publishable_zhsV4zDO-NOdJYmfb4BdPg_1LvxAhG4";
const MAX_BYTES = 5 * 1024 * 1024;
const TIPOS = {"application/pdf":"pdf","image/jpeg":"jpg","image/png":"png","image/webp":"webp"};

const $ = id => document.getElementById(id);
const form = $("form"), statusEl = $("status"), btn = $("enviar");

function parseMonto(txt){
  let s = txt.trim().replace(/[\s$]/g,"");
  if(!s) return null;
  if(s.includes(",")) s = s.replace(/\./g,"").replace(",",".");
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,"");
  const n = Number(s);
  return Number.isFinite(n) && n > 0 && n < 1e12 ? Math.round(n*100)/100 : null;
}

$("archivo").addEventListener("change", e => {
  const f = e.target.files[0];
  $("file-name").textContent = f ? f.name : "Elegir PDF o imagen";
  $("e-archivo").textContent = "";
});

function setStatus(msg, bad){ statusEl.textContent = msg; statusEl.classList.toggle("bad", !!bad); }

async function api(path, opts){
  const r = await fetch(SUPABASE_URL + path, opts);
  if(!r.ok){
    let detail = ""; try { detail = (await r.json()).message || ""; } catch(_){}
    throw new Error(r.status + " " + detail);
  }
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  ["titulo","monto","archivo"].forEach(k => $("e-"+k).textContent = "");
  setStatus("");

  const titulo = $("titulo").value.trim();
  const monto = parseMonto($("monto").value);
  const file = $("archivo").files[0];
  let ok = true;

  if(titulo.length < 3){ $("e-titulo").textContent = "Escribí un título de al menos 3 letras."; ok = false; }
  if(monto === null){ $("e-monto").textContent = "Ingresá un monto mayor a cero, por ejemplo 12.500 o 12500,50."; ok = false; }
  if(file){
    if(!TIPOS[file.type]){ $("e-archivo").textContent = "El archivo tiene que ser PDF, JPG, PNG o WebP."; ok = false; }
    else if(file.size > MAX_BYTES){ $("e-archivo").textContent = "El archivo pesa más de 5 MB."; ok = false; }
  }
  if(!ok) return;

  btn.disabled = true;
  try{
    let adjunto_path = null;
    if(file){
      setStatus("Subiendo el archivo…");
      adjunto_path = crypto.randomUUID() + "." + TIPOS[file.type];
      await api("/storage/v1/object/adjuntos/" + adjunto_path, {
        method:"POST",
        headers:{ apikey:SUPABASE_KEY, "Content-Type":file.type },
        body:file
      });
    }
    setStatus("Enviando el pedido…");
    await api("/rest/v1/pedidos", {
      method:"POST",
      headers:{ apikey:SUPABASE_KEY, "Content-Type":"application/json", Prefer:"return=minimal" },
      body:JSON.stringify({ titulo, monto, adjunto_path })
    });
    form.hidden = true; $("done").hidden = false; setStatus("");
  }catch(err){
    console.error(err);
    setStatus("No se pudo enviar el pedido (" + err.message.trim() + "). Revisá la conexión y probá de nuevo.", true);
  }finally{
    btn.disabled = false;
  }
});

$("otro").addEventListener("click", () => {
  form.reset(); $("file-name").textContent = "Elegir PDF o imagen";
  $("done").hidden = true; form.hidden = false; $("titulo").focus();
});

if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
</script>
</body>
</html>
